# electron-builder config — Phase 16 (Windows installer)
# Docs: https://www.electron.build — run via `npm run dist` on Windows.
# Icons are generated + committed: build/icon.ico (installer) and build/icon.png
# (window + tray, copied to dist/resources by scripts/build.mjs).
appId: ai.local.personalai
productName: Local Personal AI
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# "Start the app by opening one thing": handled by build/installer.nsh
# (auto-discovered from buildResources). It lists us in Explorer's
# "Öffnen mit…" for the formats our §12 importers parse, WITHOUT stealing
# default-handler status for .txt/.json/... — deliberately not the
# top-level `fileAssociations` option, whose bundled NSIS macro overwrites
# `Software\Classes\<.ext>` defaults. Launched paths land in argv and
# src/main/launchFiles.ts turns them into knowledge imports.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: true
win:
  target:
    - target: nsis
      arch: [x64, arm64] # spec target: Windows x64 OR ARM64
    - target: portable
      arch: [x64] # no-install run; data still lands in %APPDATA%/lpai
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Local Personal AI
  uninstallDisplayName: Local Personal AI
  # local-first principle: never silently delete user data (config/db/memory)
  deleteAppDataOnUninstall: false
